version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hackeval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackeval
      POSTGRES_PASSWORD: hackeval_secret_password
      POSTGRES_DB: hackeval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackeval"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackeval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hackeval-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://hackeval:hackeval_secret_password@postgres:5432/hackeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/app/data
      - ./competition_config.yaml:/app/competition_config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hackeval-worker
    restart: unless-stopped
    command: celery -A backend.app.services.verification_worker worker --loglevel=info -c 5
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://hackeval:hackeval_secret_password@postgres:5432/hackeval
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./competition_config.yaml:/app/competition_config.yaml:ro
    depends_on:
      backend:
        condition: service_started

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hackeval-mcp-server
    restart: unless-stopped
    command: python -m backend.app.mcp_server
    environment:
      - DATABASE_URL=postgresql://hackeval:hackeval_secret_password@postgres:5432/hackeval
      - MCP_ADMIN_API_KEY=mcp_secret_admintoken_7f8a9b2c3d4e5f6a
    volumes:
      - ./data:/app/data
      - ./competition_config.yaml:/app/competition_config.yaml:ro
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackeval-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
